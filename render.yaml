services:
  - type: web
    name: cameratd
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: node backend/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Dan gia tri trong Render: Settings -> Environment (khong de trong code)
      - key: DATABASE_URL        # Postgres (Neon) - noi luu san pham, cong trinh, cai dat
        sync: false
      - key: NEON_S3_ENDPOINT    # Kho file Neon (anh + video)
        sync: false
      - key: NEON_S3_BUCKET
        sync: false
      - key: NEON_S3_KEY
        sync: false
      - key: NEON_S3_SECRET
        sync: false
      - key: CLOUDINARY_URL      # Khong bat buoc - cach cu, chi dung neu da lo cai
        sync: false
      - key: ADMIN_TAI_KHOAN     # Email hoac so dien thoai de dang nhap quan tri
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
